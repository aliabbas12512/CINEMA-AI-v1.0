# Local infrastructure + app. Secrets come from .env (never commit it).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
    ports: ["3000:3000"]
    volumes: [storage:/app/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: .
    command: ["npx", "tsx", "src/worker/index.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
    volumes: [storage:/app/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
volumes:
  pgdata:
  redisdata:
  storage:
